<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OlexTask - To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="overlay"></div>
    <header>
      <div class="leftHeader">
        <button class="menu"></button>
        <h2 class="currentTitle">All Tasks</h2>
      </div>
      <div class="rightHeader">
        <button class="search"></button>
        <button class="threeDots"></button>
      </div>
    </header>
    <nav class="mainNav">
      <!-- make everything li -->
      <div class="navIndicator"></div>
      <h1>OlexTask</h1>
      <div class="dividerLine"></div>
      <button class="allTasks selectedTitle" data-page-type="task">
        <span class="allTasksSVG"></span>All Tasks
      </button>
      <button
        data-data-i-d="uncategorizedID"
        class="uncategorized"
        data-page-type="task"
      >
        <span class="uncategorizedSVG"></span>Uncategorized
      </button>
      <button class="completed" data-page-type="task">
        <span class="completedSVG"></span>Completed
      </button>

      <div class="dividerLine bookmarkInsert"></div>

      <button class="notes" data-page-type="notes">
        <span class="notesSVG"></span>Notes
      </button>
      <button class="statistics" data-page-type="statistics">
        <span class="statisticsSVG"></span>Statistics
      </button>
      <button class="settings" data-page-type="settings">
        <span class="settingsSVG"></span>Settings
      </button>
    </nav>
    <main>
      <button class="add"></button>
      <menu class="contextMenu">
        <li>
          <button class="editCont"><span class="editSVG"></span>Edit</button>
        </li>
        <li>
          <button class="deleteCont">
            <span class="deleteSVG"></span>Delete
          </button>
        </li>
      </menu>
      <ul class="taskSectionContainer section">
        <!-- example task -->

        <!-- <li class="taskItem">
          <div class="priorityIndicator"></div>
          <div class="taskStatic">
            <label class="taskItemCheckbox">
              <input type="checkbox" class="sr-only" />
              <span class="checkboxSVG"></span>
            </label>
            <div class="taskItemContent">
              <h3 class="taskItemTitle">Eat eggs</h3>
              <div class="taskItemDate">
                <span class="dateSVG"></span>
                <time datetime="2024-12-12T05:40">Dec 12th, 5:40</time>
              </div>
            </div>
            <button class="taskItemOptions" aria-label="Expand task details">
              ▾
            </button>
          </div>
          <div class="taskExpandCont">
            <p class="taskDesc">
              Gather bank statements (last 3 months), employment letter from
              TaxAlex, property ownership docs. Print everything double-sided.
            </p>
            <div class="taskExpandButtonCont">
              <button class="taskEdit">Edit</button>
              <button class="taskDelete">Delete</button>
            </div>
          </div>
        </li> -->
      </ul>

      <div class="notesSectionContainer section">
        <div class="notesSectionSubcontainer"></div>
      </div>
      <div class="statisticsSectionContainer section">stats</div>
      <div class="settingsSectionContainer section">set</div>
      <dialog class="addDialog">
        <form action="/" class="addForm" method="get" novalidate>
          <button class="closeDialog closeSVG" type="button"></button>
          <h2 class="dialogTitle">Add New</h2>
          <div class="newOptions" aria-label="Add options">
            <button
              type="button"
              role="radio"
              aria-checked="true"
              class="optionButton activeButton taskButton"
            >
              Task
            </button>
            <button
              role="radio"
              aria-checked="false"
              class="optionButton noteButton"
              type="button"
            >
              Note
            </button>
            <button
              role="radio"
              aria-checked="false"
              class="optionButton categoryButton"
              type="button"
            >
              Category
            </button>
          </div>

          <div class="taskContent">
            <div class="taskTitleContainer inputContainer">
              <div class="taskTitleSubcontainer">
                <label class="taskTitleLabel" for="taskTitle">Title</label>
                <div class="taskErrorField">Title can't be empty!</div>
              </div>
              <input
                type="text"
                id="taskTitle"
                name="taskTitle"
                required
                maxlength="100"
                minlength="3"
                placeholder="Task Title..."
                autocomplete="off"
              />
            </div>
            <div class="datePrioCont">
              <div class="dateCont inputContainer">
                <label class="taskDateLabel" for="taskDate">Due Date</label>
                <input
                  type="datetime-local"
                  id="taskDate"
                  name="taskDate"
                  required
                />
              </div>
              <div class="prioCont">
                <div id="prioLabel">Priority</div>
                <div
                  class="prioOptions"
                  aria-labelledby="prioLabel"
                  role="group"
                ></div>
                <button
                  type="button"
                  role="radio"
                  aria-checked="true"
                  class="prioButton lowPrio selectedPrio"
                ></button>
                <button
                  type="button"
                  role="radio"
                  aria-checked="false"
                  class="prioButton midPrio"
                ></button>
                <button
                  type="button"
                  role="radio"
                  aria-checked="false"
                  class="prioButton highPrio"
                ></button>
              </div>
            </div>
            <div class="belongCont">
              <label class="taskBelongLabel" for="taskBelong">Category</label>
              <select name="taskBelong" id="taskBelong">
                <button>
                  <selectedcontent></selectedcontent>
                </button>
              </select>
            </div>
            <div class="descCont">
              <label class="taskDescriptionLabel" for="taskDescription"
                >Description</label
              >
              <textarea
                name="taskDescription"
                id="taskDescription"
                placeholder="Describe your task..."
              ></textarea>
            </div>
          </div>

          <div class="noteContent">
            <div class="noteTitleContainer inputContainer">
              <div class="noteTitleSubcontainer">
                <label for="noteTitle">Title</label>
                <div class="noteErrorField">Note can't be empty!</div>
              </div>
              <input
                type="text"
                id="noteTitle"
                name="noteTitle"
                required
                maxlength="100"
                minlength="3"
                placeholder="Note Title..."
                autocomplete="off"
              />
            </div>
            <div class="noteDescriptionContainer inputContainer">
              <label for="noteDescription">Description</label>
              <textarea
                name="noteDescription"
                id="noteDescription"
                placeholder="Describe your note..."
              ></textarea>
            </div>
          </div>

          <div class="categoryContent">
            <div class="categoryTitleContainer inputContainer">
              <div class="categoryTitleSubcontainer">
                <label for="categoryTitle">Name</label>
                <div class="categoryErrorField">Name can't be empty!</div>
              </div>
              <input
                type="text"
                id="categoryTitle"
                name="categoryTitle"
                required
                maxlength="100"
                minlength="3"
                placeholder="Category Name..."
                autocomplete="off"
              />
            </div>
            <div id="colorLabel">Color</div>
            <div class="colorOptions" aria-labelledby="colorLabel" role="group">
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton redColor selectedColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="false"
                class="colorButton greenColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="false"
                class="colorButton blueColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="false"
                class="colorButton yellowColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="false"
                class="colorButton pinkColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="false"
                class="colorButton purpleColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="false"
                class="colorButton tealColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="false"
                class="colorButton orangeColor"
              ></button>
            </div>
          </div>
          <button class="submitButton" type="submit">Add</button>
        </form>
      </dialog>
    </main>
  </body>
</html>
