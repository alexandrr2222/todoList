<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OlexTask - To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="overlay"></div>
    <header>
      <div class="leftHeader">
        <button class="menu"></button>
        <h2 class="currentTitle">All Tasks</h2>
      </div>
      <div class="rightHeader">
        <button class="date"></button>
        <button class="search"></button>
      </div>
    </header>
    <nav>
      <div class="navIndicator"></div>
      <h1>OlexTask</h1>
      <div class="dividerLine"></div>
      <button class="allTasks selectedTitle">
        <span class="allTasksSVG"></span>All Tasks
      </button>
      <button class="uncategorized">
        <span class="uncategorizedSVG"></span>Uncategorized
      </button>
      <button class="completed">
        <span class="completedSVG"></span>Completed
      </button>
      <button class="bookmark bookmark0">
        <span class="bookmarkSVG bookmarkIcon0"></span>Work
      </button>
      <button class="bookmark bookmark1">
        <span class="bookmarkSVG bookmarkIcon1"></span>Personal
      </button>
      <button class="bookmark bookmark2">
        <span class="bookmarkSVG bookmarkIcon2"></span>Reading
      </button>

      <div class="dividerLine bookmarkInsert"></div>

      <button class="notes"><span class="notesSVG"></span>Notes</button>
      <button class="stats"><span class="statsSVG"></span>Statistics</button>
      <button class="settings">
        <span class="settingsSVG"></span>Settings
      </button>
    </nav>
    <main>
      <button class="add"></button>
      <dialog class="addDialog">
        <form action="/" class="addForm" method="get" novalidate>
          <button class="closeDialog" type="button"></button>
          <h2>Add New</h2>
          <div class="newOptions" aria-label="Add options">
            <button
              type="button"
              role="radio"
              aria-checked="true"
              class="optionButton activeButton taskButton"
            >
              Task
            </button>
            <button
              role="radio"
              aria-checked="false"
              class="optionButton noteButton"
              type="button"
            >
              Note
            </button>
            <button
              role="radio"
              aria-checked="false"
              class="optionButton categoryButton"
              type="button"
            >
              Category
            </button>
          </div>
          <div class="categoryContent">
            <div class="categoryTitleContainer inputContainer">
              <div class="categoryTitleSubcontainer">
                <label for="categoryTitle">Name</label>
                <div class="categoryErrorField">Name can't be empty!</div>
              </div>
              <input
                type="text"
                id="categoryTitle"
                name="categoryTitle"
                required
                maxlength="100"
                minlength="3"
                placeholder="Category Name..."
                autocomplete="off"
              />
            </div>
            <div id="colorLabel">Color</div>
            <div class="colorOptions" aria-labelledby="colorLabel" role="group">
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton redColor selectedColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton greenColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton blueColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton yellowColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton pinkColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton purpleColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton tealColor"
              ></button>
              <button
                type="button"
                role="radio"
                aria-checked="true"
                class="colorButton orangeColor"
              ></button>
            </div>
          </div>
          <button class="submitButton" type="submit">Add</button>
        </form>
      </dialog>
    </main>
  </body>
</html>
